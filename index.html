<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu Hỏi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fcfbf9;
            color: #2d3748;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #d97706;
            margin-bottom: 12px;
        }

        /* Khung chứa dải nút vuốt ngang */
        .strip-wrapper {
            position: relative;
            margin-bottom: 14px;
        }

        /* Dải Button 1 hàng ngang - vuốt trái/phải, không xuống dòng */
        .button-strip {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 10px;
            padding: 4px 2px 10px 2px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .button-strip::-webkit-scrollbar {
            height: 5px;
        }

        .button-strip::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        .button-strip::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Kiểu dáng từng ô Button */
        .question-btn {
            flex: 0 0 auto;
            white-space: nowrap;
            background-color: #ffffff;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            user-select: none;
        }

        .question-btn:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        /* Trạng thái khi Button đang được chọn (màu cam nhạt) */
        .question-btn.active {
            background-color: #fbeee0;
            border-color: #e5a970;
            color: #b45309;
            font-weight: 600;
        }

        /* Khung hiển thị Câu Trả Lời nằm ngay bên dưới thanh trượt */
        .answer-box {
            background-color: #f1f8f5;
            border: 1px solid #b7dfd0;
            border-radius: 14px;
            padding: 16px 18px;
            line-height: 1.65;
            font-size: 15.5px;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .answer-title {
            font-size: 17px;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #b7dfd0;
        }

        .answer-line {
            margin-bottom: 6px;
        }

        .answer-line.heading {
            font-weight: 700;
            color: #0f5132;
            margin-top: 12px;
        }

        .answer-line.heading:first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-title">Câu Hỏi</div>

    <!-- Dải Button vuốt ngang 1 dòng duy nhất -->
    <div class="strip-wrapper">

    <div id="answerBox" class="answer-box">

    </div>
</div>

                "- Có vấn đề báo cán bộ biết, cắt liệu vấn đề giữ lại",
                "- Nếu lô sau giống như lô trước không cải thiện => ta mở đơn trả hàng cho xưởng cung ứng yêu cầu xưởng cung ứng qua xem liệu",
                "- Nếu lô sau về được cải thiện không có vấn đề gì ta cũng báo cáo cán bộ biết ngay là hàng OK"
            ]
        },
        {
            q: "Thế nào là lỗi trọng điểm, lỗi chính, lỗi nhỏ",
            a: [
                "Lỗi trọng tâm: Những lỗi ảnh hưởng đến sự an toàn của người dùng khi sử dụng hoặc rủi ro pháp lý",
                "- Thông tin tem lưỡi gà",
                "- Kết quả thử nghiệm phòng thí nghiệm liệu đầu vào",
                "Lỗi chính: Những lỗi ảnh hưởng đến việc bán hoặc ngưng bán sản phẩm, quá trình sử dụng hoặc quá trình hình thành sản phẩm",
                "- Màu sắc, quy cách, sai liệu,...",
                "Lỗi nhỏ: Những lỗi không ảnh hưởng trực tiếp đến việc bán sản phẩm, việc sử dụng hay quá trình hình thành sản phẩm. Khách hàng sẽ phát hiện ra lỗi này khi mua hàng nhưng họ vẫn sẽ quyết định mua nó",
                "- Màu sắc khác nhau, vệ sinh và ngoại quan...",
                "2.1 Tần suất kiểm tra ngoại quan:",
                "- Vải lưới, da nhân tạo, TPU film, da bò: kiểm 100% tất cả các cuộn",
                "- Các vật liệu còn lại: Kiểm theo lưu trình quy định"
            ]
        },
        {
            q: "Phân khu trong kho",
            a: [
                "Mục đích của việc phân khu:",
                "- Phân chia khu vực hàng OK, hàng No OK, hàng chưa kiểm hoặc hàng đã nhập kho để khi phát hàng tránh phát hàng chưa kiểm hoặc hàng No OK cho hiện trường sản xuất.",
                "- Hàng có vấn đề trước tiên cần mở đơn vật liệu không đạt, thông báo cán bộ để xử lý, sau đó dán tem đỏ (Reject), ghi rõ ngày mở đơn và để lại hàng ở khu không hợp cách (Khu vực Reject). Sau đó nhập kết quả vào hệ thống.",
                "Trách nhiệm QCTT:",
                "- Kiểm tra phẩm chất đầu vào, hạn chế vấn đề phát sinh khi qua hiện trường.",
                "- Khi phát sinh vấn đề QC mở đơn => thông báo cán bộ, chủ quản => dán tem REJECTED ghi rõ ngày tháng => thông báo kho và để hàng ở khu không hợp cách => nhập hệ thống."
            ]
        },
        {
            q: "Đèn so màu liệu",
            a: [
                "- Đèn hợp cách so màu là hộp đèn",
                "- Đèn chuẩn Decathlon là TL84",
                "- Đèn thông dụng là đèn TL84 (F11) và đèn D65",
                "- Tiêu chuẩn so màu < 1 OK"
            ]
        }
    ];

    const buttonStrip = document.getElementById('buttonStrip');
    const answerTitle = document.getElementById('answerTitle');
    const answerContent = document.getElementById('answerContent');

    // Khởi tạo các nút câu hỏi trên 1 hàng ngang
    qaList.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'question-btn';
        btn.textContent = item.q;
        btn.onclick = () => selectQuestion(index);
        buttonStrip.appendChild(btn);
    });

    function selectQuestion(index) {
        const buttons = document.querySelectorAll('.question-btn');

        buttons.forEach((btn, idx) => {
            if (idx === index) {
                btn.classList.add('active');
                btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            } else {
                btn.classList.remove('active');
            }
        });

        answerTitle.textContent = qaList[index].q;
        answerContent.innerHTML = '';

        // Tạo từng dòng riêng biệt để đảm bảo luôn xuống dòng chuẩn trên mọi trình duyệt
        qaList[index].a.forEach(line => {
            const div = document.createElement('div');
            const isHeading = !line.trim().startsWith('-') && !line.trim().startsWith('+') && line.trim().endsWith(':');
            div.className = isHeading ? 'answer-line heading' : 'answer-line';
            div.textContent = line;
            answerContent.appendChild(div);
        });
    }

    // Mặc định chọn câu đầu tiên khi mở trang
    selectQuestion(0);
</script>

</html>
